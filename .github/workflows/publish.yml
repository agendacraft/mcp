name: Publish reviewed npm package
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter @agendacraft/mcp to confirm a reviewed release
        required: true
        type: string
permissions:
  contents: read
jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit maintainer release
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$RELEASE_EVENT" != workflow_dispatch ] ||
             [ "$RELEASE_REF" != refs/heads/main ] ||
             [ "$RELEASE_CONFIRMATION" != '@agendacraft/mcp' ]; then
            echo 'A maintainer must manually dispatch a reviewed release from main and confirm @agendacraft/mcp.' >&2
            exit 1
          fi
  verify:
    needs: authorize
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Require security reporting channel
        run: |
          if grep -q 'TODO for the captain' SECURITY.md; then
            echo 'Complete and verify the private reporting channel before releasing.' >&2
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: npm install --global pnpm@11.2.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm publish --provenance --access public
