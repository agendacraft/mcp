name: Verify MCP package
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.2.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm generate:api
      - run: git diff --exit-code -- src/api
      - run: pnpm build
      - run: git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - run: pnpm test:pack
      - run: npm pack --dry-run
      - name: Scan source history and packed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/gitleaks
          gh release download v8.30.1 -R gitleaks/gitleaks \
            --pattern 'gitleaks_8.30.1_linux_x64.tar.gz' \
            --pattern 'gitleaks_8.30.1_checksums.txt' --dir .cache/gitleaks
          cd .cache/gitleaks
          sha256sum --check --ignore-missing gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
          cd ../..
          .cache/gitleaks/gitleaks git . --redact --no-banner --ignore-gitleaks-allow
          .cache/gitleaks/gitleaks dir .cache/pack-smoke/extracted --redact --no-banner --ignore-gitleaks-allow
